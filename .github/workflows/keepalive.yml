 Garde le projet Supabase actif (évite la mise en pause de l'offre gratuite).
# À placer dans le dépôt GitHub sous le nom : .github/workflows/keepalive.yml
name: Garder Supabase actif
 
on:
  schedule:
    - cron: "17 6 * * *"      # tous les jours vers 06h17 (heure UTC)
  workflow_dispatch:           # permet aussi de le lancer à la main
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Interroger la base (lit config.js)
        run: |
          URL=$(grep -oP 'url:\s*"\K[^"]+' config.js | head -1)
          KEY=$(grep -oP 'key:\s*"\K[^"]+' config.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js n'est pas rempli : rien à faire."
            exit 0
          fi
          curl -sS -f \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/site_settings?select=key&limit=1"
          echo
          echo "Base interrogée avec succès."
 
